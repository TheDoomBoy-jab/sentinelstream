[project]
name = "sentinel-stream"
version = "0.1.0"
description = "High-Throughput Financial Fraud Detection & Event Streaming Microservice"
authors = [
    { name = "aahan", email = "aahannayak86@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "fastapi>=0.115.0",
    "kafka-python-ng>=2.2.3",
    "numpy>=2.0.0",
    "prometheus-client>=0.20.0",
    "psycopg2-binary>=2.9.9",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
sentinel-stream = "sentinel_stream.main:start"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore:.*starlette.testclient.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",   # Allow Depends() and BackgroundTasks in FastAPI function arguments
    "S110",   # Allow try-except pass for optional services
    "BLE001", # Allow catching general Exception
    "PLW1508" # Allow string/int env fallback
]
