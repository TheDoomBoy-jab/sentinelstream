[project]
name = "sentinel-stream"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "aahan", email = "aahannayak86@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "fastapi>=0.142.2",
    "kafka-python-ng>=2.2.3",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "prometheus-client>=0.26.0",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
sentinel-stream = "sentinel_stream:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
