name: SentinelStream CI/CD Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    name: Lint, Test & Model Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Linting
        run: uv run ruff check .

      - name: Run Pytest Suite & Performance Regression Gates
        run: uv run pytest -v

  docker-build-verification:
    name: Verify Multi-Stage Dockerfile
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry-Run Verification)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: sentinelstream-api:ci-test
